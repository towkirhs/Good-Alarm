name: Build beta APK

# Builds the AI planner branch as "Good Alarm Beta" (com.goodalarm.beta).
# It installs next to the normal app and keeps its own data.
# Published as a pre-release so it never becomes the "latest" release of the main app.

on:
  push:
    branches: [feature/ai-planner]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ID_SUFFIX: .beta
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest

      - name: Build release APK
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk GoodAlarm-Beta-1.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GoodAlarm-Beta-apk
          path: GoodAlarm-Beta-1.${{ github.run_number }}.apk

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta-1.${{ github.run_number }}
          name: Good Alarm Beta 1.${{ github.run_number }}
          body: ${{ github.event.head_commit.message }}
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: GoodAlarm-Beta-1.${{ github.run_number }}.apk
